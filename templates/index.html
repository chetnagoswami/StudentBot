<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentBot AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #080808;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* =========================
           MAIN CHAT
        ========================= */

        .chat-container {
            width: 440px;
            height: 680px;

            background: #101010;

            border: 1px solid #292929;
            border-radius: 22px;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(220, 38, 38, 0.12);
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            height: 70px;

            padding: 12px 16px;

            background:
                linear-gradient(
                    135deg,
                    #7f1d1d,
                    #dc2626
                );

            display: flex;
            align-items: center;

            gap: 11px;

            flex-shrink: 0;
        }

        .logo {
            width: 44px;
            height: 44px;

            border-radius: 12px;

            background: rgba(255,255,255,0.14);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
        }

        .header h2 {
            font-size: 19px;
            line-height: 1.2;
        }

        .status {
            margin-top: 3px;

            font-size: 11px;

            color: #fecaca;
        }


        /* =========================
           CHAT AREA
        ========================= */

        .chat-box {
            flex: 1;

            padding: 14px;

            overflow-y: auto;

            background: #0c0c0c;
        }


        /* =========================
           WELCOME CARD
        ========================= */

        .welcome-card {
            width: 100%;

            background: #151515;

            border: 1px solid #292929;

            border-radius: 14px;

            padding: 13px 15px;

            margin: 0 0 14px 0;

            text-align: left;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.25);
        }

        .welcome-top {
            display: flex;
            align-items: center;

            gap: 8px;

            margin-bottom: 7px;
        }

        .welcome-icon {
            width: 30px;
            height: 30px;

            border-radius: 9px;

            background: #dc2626;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 15px;
        }

        .welcome-title {
            font-size: 16px;

            font-weight: 700;

            color: white;
        }

        .welcome-heading {
            font-size: 13px;

            font-weight: 600;

            color: #f87171;

            margin-bottom: 5px;
        }

        .welcome-text {
            font-size: 12px;

            line-height: 1.45;

            color: #bdbdbd;

            margin-bottom: 7px;
        }

        .welcome-question {
            font-size: 12px;

            color: #eeeeee;

            font-weight: 500;
        }


        /* =========================
           NORMAL MESSAGES
        ========================= */

        .message {
            max-width: 82%;

            padding: 10px 13px;

            margin: 7px 0;

            border-radius: 14px;

            line-height: 1.45;

            font-size: 14px;

            white-space: pre-wrap;

            word-wrap: break-word;

            text-align: left;
        }

        .bot {
            background: #1c1c1c;

            color: #f5f5f5;

            margin-right: auto;

            border: 1px solid #2c2c2c;

            border-bottom-left-radius: 5px;
        }

        .user {
            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #991b1b
                );

            color: white;

            margin-left: auto;

            border-bottom-right-radius: 5px;
        }


        /* =========================
           TYPING
        ========================= */

        .typing {
            display: none;

            width: fit-content;

            padding: 8px 11px;

            background: #1c1c1c;

            border: 1px solid #2c2c2c;

            border-radius: 13px;

            color: #999;

            font-size: 12px;
        }

        .dots {
            display: inline-flex;

            gap: 4px;

            margin-left: 5px;
        }

        .dots span {
            width: 5px;
            height: 5px;

            background: #ef4444;

            border-radius: 50%;

            animation: blink 1.2s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }


        /* =========================
           INPUT
        ========================= */

        .input-area {
            height: 68px;

            display: flex;

            gap: 8px;

            padding: 11px;

            background: #111111;

            border-top: 1px solid #252525;

            flex-shrink: 0;
        }

        #user-input {
            flex: 1;

            height: 45px;

            padding: 0 13px;

            background: #1b1b1b;

            color: white;

            border: 1px solid #333;

            border-radius: 12px;

            outline: none;

            font-size: 14px;
        }

        #user-input:focus {
            border-color: #dc2626;

            box-shadow:
                0 0 0 3px
                rgba(220,38,38,0.10);
        }

        #user-input::placeholder {
            color: #707070;
        }

        button {
            width: 46px;
            height: 45px;

            border: none;

            border-radius: 12px;

            background: #dc2626;

            color: white;

            cursor: pointer;

            font-size: 18px;

            transition: 0.2s;
        }

        button:hover {
            background: #ef4444;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            body {
                align-items: stretch;
            }

            .chat-container {
                width: 100%;
                height: 100vh;

                border-radius: 0;
                border: none;
            }

            .chat-box {
                padding: 12px;
            }

            .message {
                max-width: 88%;
            }
        }

    </style>

</head>


<body>


    <div class="chat-container">


        <!-- HEADER -->

        <div class="header">

            <div class="logo">
                🤖
            </div>

            <div>

                <h2>
                    StudentBot AI
                </h2>

                <div class="status">
                    ● AI Student Assistant
                </div>

            </div>

        </div>


        <!-- CHAT -->

        <div
            class="chat-box"
            id="chat-box"
        >


            <!-- PROFESSIONAL WELCOME CARD -->

            <div class="welcome-card">

                <div class="welcome-top">

                    <div class="welcome-icon">
                        👋
                    </div>

                    <div class="welcome-title">
                        Welcome to StudentBot
                    </div>

                </div>

                <div class="welcome-heading">
                    Your AI Study Companion
                </div>

                <div class="welcome-text">
                    Get help with coding, AI, exams,
                    college subjects and everyday learning.
                </div>

                <div class="welcome-question">
                    Ask me anything to get started.
                </div>

            </div>


            <!-- TYPING -->

            <div
                class="typing"
                id="typing"
            >

                StudentBot is thinking

                <span class="dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Ask StudentBot anything..."
                autocomplete="off"
            >

            <button
                id="send-button"
                type="button"
                title="Send"
            >
                ➤
            </button>

        </div>

    </div>


    <script>

        const input =
            document.getElementById("user-input");

        const sendButton =
            document.getElementById("send-button");

        const chatBox =
            document.getElementById("chat-box");

        const typing =
            document.getElementById("typing");


        async function sendMessage() {

            const message =
                input.value.trim();

            if (message === "") {
                return;
            }


            /* USER MESSAGE */

            const userMessage =
                document.createElement("div");

            userMessage.className =
                "message user";

            userMessage.textContent =
                message;

            chatBox.insertBefore(
                userMessage,
                typing
            );


            input.value = "";

            input.disabled = true;

            sendButton.disabled = true;


            /* TYPING */

            typing.style.display = "block";

            chatBox.scrollTop =
                chatBox.scrollHeight;


            try {

                const response =
                    await fetch(
                        "/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                message: message
                            })
                        }
                    );


                if (!response.ok) {
                    throw new Error(
                        "Server error"
                    );
                }


                typing.style.display =
                    "none";


                /* BOT MESSAGE */

                const botMessage =
                    document.createElement("div");

                botMessage.className =
                    "message bot";

                botMessage.textContent =
                    "";


                chatBox.insertBefore(
                    botMessage,
                    typing
                );


                /* STREAM RESPONSE */

                const reader =
                    response.body.getReader();

                const decoder =
                    new TextDecoder("utf-8");


                while (true) {

                    const result =
                        await reader.read();

                    if (result.done) {
                        break;
                    }


                    const text =
                        decoder.decode(
                            result.value,
                            {
                                stream: true
                            }
                        );


                    botMessage.textContent +=
                        text;


                    chatBox.scrollTop =
                        chatBox.scrollHeight;

                }

            }


            catch (error) {

                console.error(
                    "Chat Error:",
                    error
                );


                typing.style.display =
                    "none";


                const errorMessage =
                    document.createElement("div");

                errorMessage.className =
                    "message bot";

                errorMessage.textContent =
                    "Sorry, I am unable to connect to the server.";

                chatBox.insertBefore(
                    errorMessage,
                    typing
                );

            }


            /* ENABLE INPUT */

            input.disabled = false;

            sendButton.disabled = false;

            input.focus();

            chatBox.scrollTop =
                chatBox.scrollHeight;

        }


        /* SEND */

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        /* ENTER */

        input.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );

    </script>

</body>

</html>
